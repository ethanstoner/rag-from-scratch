[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ragfs"
version = "0.1.0"
description = "Eighteen RAG techniques built from scratch in plain Python and benchmarked on one dataset"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy", "httpx", "scikit-learn", "beautifulsoup4"]

[project.optional-dependencies]
neural = ["torch", "transformers"]
dev = ["pytest", "matplotlib"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["ollama: needs a running Ollama server", "gpu: needs torch + model downloads"]
